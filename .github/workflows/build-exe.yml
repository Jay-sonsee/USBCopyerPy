name: build-exe

# 目标：Windows 7 SP1 x64 与 Windows 10 都能跑（重新索引触发）
# 因此使用 Python 3.8（3.9 起官方不再支持 Win7）+ PyInstaller 5.13（最后一个
# 支持 Win7 的 bootloader 系列）。同时产出 x64 与 x86 两个架构，x86 版可覆盖
# 老机器的 32 位系统。

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            suffix: x64
          - arch: x86
            suffix: x86
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.8 (${{ matrix.arch }})
        uses: actions/setup-python@v5
        with:
          python-version: "3.8"
          architecture: ${{ matrix.arch }}

      - name: Install PyInstaller
        run: |
          python -m pip install --upgrade pip
          python -m pip install "pyinstaller==5.13.2"

      - name: Smoke test before packaging
        run: python -m unittest discover -s tests -t .

      - name: Build windowed exe
        run: >
          pyinstaller --noconfirm --clean --onefile --windowed
          --name "USBCopyerPy-${{ matrix.suffix }}"
          --paths .
          --hidden-import usbcopyer.ui
          packaging/entry.py

      - name: Build console exe
        run: >
          pyinstaller --noconfirm --clean --onefile --console
          --name "USBCopyerPy-console-${{ matrix.suffix }}"
          --paths .
          --hidden-import usbcopyer.ui
          packaging/entry.py

      - name: Verify binaries
        run: |
          Get-ChildItem dist -Filter *.exe | ForEach-Object {
            "{0}  {1:N1} MB" -f $_.Name, ($_.Length / 1MB)
            if ($_.Length -lt 3MB) { throw "产物异常偏小：$($_.Name)" }
          }
          & "dist\USBCopyerPy-console-${{ matrix.suffix }}.exe" --version
          if ($LASTEXITCODE -ne 0) { throw "console exe --version 失败" }
          & "dist\USBCopyerPy-console-${{ matrix.suffix }}.exe" --selftest
          if ($LASTEXITCODE -ne 0) { throw "打包产物自检失败（tkinter 可能没打进去）" }

      - uses: actions/upload-artifact@v4
        with:
          name: exe-${{ matrix.suffix }}
          path: dist/*.exe

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List files
        run: ls -lh artifacts

      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: ${{ github.ref_name }}
          body: |
            USBCopyerPy ${{ github.ref_name }}

            - `USBCopyerPy-x64.exe`：64 位，Win7 SP1 x64 / Win10 x64
            - `USBCopyerPy-x86.exe`：32 位，兼容 32 位系统
            - `*-console.exe`：带控制台，便于看日志与使用 `--headless`
          files: artifacts/*.exe
          draft: false
          prerelease: false
